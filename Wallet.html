<!--
  ══════════════════════════════════════════════════════════════════
  Wallet.html — Fragment (ไม่มี <html><head><body>)
  โหลดผ่าน fetch() จาก index.html แล้ว inject เข้า DOM
  ทุก function/variable ใช้ globals จาก index.html (wlt, navTo ฯลฯ)
  ══════════════════════════════════════════════════════════════════
-->

<!-- ═══════════════════════════════════════════════════
     1) HOME WALLET SECTION — แสดงใน tab Wallet บนหน้าโฮม
     ═══════════════════════════════════════════════════ -->
  <div id="hm-wallet-section" style="display:none;padding:0 0 80px">
    <div style="padding:16px 16px 0;position:relative">
      <div style="font-size:11px;color:var(--t2);margin-bottom:4px">Total Wallet Value</div>
      <div style="display:flex;align-items:flex-end;gap:6px">
        <span id="hm-wlt-total" class="ast-hideable" style="font-size:26px;font-weight:700;font-family:var(--mono)">0.00</span>
        <!-- Currency label + selector button -->
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;position:relative">
          <span id="hm-wlt-cur-label" style="font-size:13px;color:var(--t2)">USD</span>
          <button id="hm-wlt-cur-btn" onclick="_hmWltCurToggle(event)"
            style="display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:2px 5px;cursor:pointer;gap:2px;line-height:1">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <!-- Currency dropdown -->
          <div id="hm-wlt-cur-drop"
            style="display:none;position:absolute;top:calc(100% + 6px);left:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;z-index:300;overflow:hidden;box-shadow:0 8px 24px #0008;min-width:130px">
            <div class="_hm-cur-opt" data-cur="USD"
              style="display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:12px;color:var(--t1);border-bottom:1px solid var(--border)"
              onclick="_hmWltCurSelect('USD')">
              <span style="font-size:15px">🇺🇸</span><span>USD <span style="color:var(--t3);font-size:10px">ดอลลาร์</span></span>
            </div>
            <div class="_hm-cur-opt" data-cur="THB"
              style="display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:12px;color:var(--t1);border-bottom:1px solid var(--border)"
              onclick="_hmWltCurSelect('THB')">
              <span style="font-size:15px">🇹🇭</span><span>THB <span style="color:var(--t3);font-size:10px">บาท</span></span>
            </div>
            <div class="_hm-cur-opt" data-cur="BTC"
              style="display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:12px;color:var(--t1)"
              onclick="_hmWltCurSelect('BTC')">
              <span style="font-size:15px">₿</span><span>BTC <span style="color:var(--t3);font-size:10px">บิทคอยน์</span></span>
            </div>
          </div>
        </div>
      </div>
      <div id="hm-wlt-thb" class="ast-hideable" style="font-size:12px;color:var(--t3);margin-top:2px">≈ ฿0.00</div>
    </div>

    <!-- Wallet Picker -->
    <div style="position:relative;margin:10px 16px 0" id="hm-wlt-picker-wrap">
      <button id="hm-wlt-picker-btn" onclick="_hmWltPickerToggle()"
        style="width:100%;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;font-family:var(--sans);text-align:left">
        <span id="hm-wlt-picker-ico" style="width:28px;height:28px;border-radius:8px;background:#f0b90b22;color:#f0b90b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">B</span>
        <div style="flex:1;min-width:0;overflow:hidden">
          <div id="hm-wlt-picker-label" style="font-size:12px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ไม่มีกระเป๋า</div>
          <div id="hm-wlt-picker-addr" style="font-size:10px;color:var(--t3);font-family:var(--mono);margin-top:1px">—</div>
        </div>
        <svg id="hm-wlt-picker-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;transition:transform .2s"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="hm-wlt-picker-drop" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;z-index:200;overflow:hidden;box-shadow:0 8px 24px #0006">
        <div id="hm-wlt-picker-list"></div>
        <div style="border-top:1px solid var(--border);display:flex">
          <button onclick="_hmWltPickerClose();hmWltOpen('create')" style="flex:1;background:none;border:none;border-right:1px solid var(--border);padding:10px;color:var(--y);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans)">+ สร้างใหม่</button>
          <button onclick="_hmWltPickerClose();hmWltOpen('import')" style="flex:1;background:none;border:none;padding:10px;color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--sans)">↑ Import</button>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px">
      <button onclick="hmWltOpen('send')" style="display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 4px;cursor:pointer;font-family:var(--sans)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="2" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        <span style="font-size:11px;color:var(--t2)">ส่ง</span>
      </button>
      <button onclick="hmWltOpen('receive')" style="display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 4px;cursor:pointer;font-family:var(--sans)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
        <span style="font-size:11px;color:var(--t2)">รับ</span>
      </button>
      <button onclick="hmWltOpen('history')" style="display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 4px;cursor:pointer;font-family:var(--sans)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span style="font-size:11px;color:var(--t2)">ประวัติ</span>
      </button>
      <button onclick="hmWltOpen('create')" style="display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 4px;cursor:pointer;font-family:var(--sans)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--y)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span style="font-size:11px;color:var(--t2)">สร้าง</span>
      </button>
    </div>
    <div id="hm-wlt-token-sec" style="background:var(--bg2);border-radius:12px;margin:0 12px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px">
        <span>Token</span><span>ยอด / มูลค่า</span>
      </div>
      <div style="display:flex;align-items:center;padding:13px 14px;cursor:pointer" onclick="hmWltOpen('main')">
        <div style="width:36px;height:36px;border-radius:50%;background:#26a17b22;color:#26a17b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-right:10px;flex-shrink:0">₮</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600">USDT</div><div style="font-size:11px;color:var(--t3)">BEP-20 · BSC</div></div>
        <div style="text-align:right">
          <div id="hm-wlt-usdt" class="ast-hideable" style="font-size:13px;font-weight:600;font-family:var(--mono)">0.00</div>
          <div id="hm-wlt-usdt-thb" class="ast-hideable" style="font-size:11px;color:var(--t3)">≈ ฿0 · $0</div>
        </div>
      </div>
      <div style="height:1px;background:var(--border);margin:0 14px"></div>
      <div style="display:flex;align-items:center;padding:13px 14px;cursor:pointer" onclick="hmWltOpen('main')">
        <div style="width:36px;height:36px;border-radius:50%;background:#f0b90b22;color:#f0b90b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;margin-right:10px;flex-shrink:0">B</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600">BNB</div><div style="font-size:11px;color:var(--t3)">Native · BSC</div></div>
        <div style="text-align:right">
          <div id="hm-wlt-bnb" class="ast-hideable" style="font-size:13px;font-weight:600;font-family:var(--mono)">0.0000</div>
          <div id="hm-wlt-bnb-thb" class="ast-hideable" style="font-size:11px;color:var(--t3)">≈ ฿0 · $0</div>
        </div>
      </div>
    </div>
    <div id="hm-wlt-cta" style="display:none;padding:20px 16px;text-align:center">
      <div style="font-size:13px;color:var(--t2);margin-bottom:12px">ยังไม่มีกระเป๋า Crypto</div>
      <button onclick="hmWltOpen('create')"
        style="width:100%;background:var(--y);color:#1a1d22;border:none;border-radius:20px;padding:12px 32px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--sans)">
        + สร้างกระเป๋า
      </button>
      <button onclick="hmWltOpen('import')"
        style="width:100%;background:var(--bg3);color:var(--t1);border:1px solid var(--border);border-radius:20px;padding:12px 32px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);margin-top:10px">
        ↑ Import กระเป๋า (มี PK อยู่แล้ว)
      </button>
    </div>
  </div>
<!-- /hm-wallet-section -->

<!-- ═══════════════════════════════════════════════════
     2) HOME WALLET MODAL OVERLAY
     เปิดจากหน้า Home > Wallet tab โดยไม่ต้อง navTo('assets')
     ═══════════════════════════════════════════════════ -->
<div id="hmWltModal" style="display:none;position:fixed;inset:0;z-index:3500;background:var(--bg);flex-direction:column;max-width:480px;margin:0 auto;overflow:hidden">
  <!-- TopBar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)">
    <button id="hmWltModalBack" onclick="hmWltBack()" style="background:none;border:none;color:var(--t1);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;font-family:var(--sans);padding:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="hmWltModalTitle">Wallet</span>
    </button>
    <button onclick="hmWltClose()" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:22px;line-height:1;padding:0 4px">✕</button>
  </div>
  <!-- Content area — wlt-screens จะถูก move มาแสดงที่นี่ผ่าน JS -->
  <div id="hmWltModalContent" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch">
    <!-- populated by hmWltOpen() -->
  </div>
</div>
<!-- /hmWltModal -->

<!-- ═══════════════════════════════════════════════════
     3) WALLET QR SHARE SHEET
     ═══════════════════════════════════════════════════ -->
<div id="wlt-share-sheet" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);align-items:flex-end;justify-content:center" onclick="if(event.target===this)wltCloseShareSheet()">
  <div style="background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px 32px;box-shadow:0 -4px 32px rgba(0,0,0,.5)">
    <!-- Handle bar -->
    <div style="width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 16px"></div>
    <div style="font-size:15px;font-weight:700;text-align:center;margin-bottom:4px" id="wlt-share-title">แชร์ QR Code</div>
    <div style="font-size:11px;color:var(--t3);text-align:center;margin-bottom:16px;word-break:break-all" id="wlt-share-addr-sub"></div>

    <!-- QR Preview -->
    <div style="display:flex;justify-content:center;margin-bottom:16px">
      <div id="wlt-share-qr-preview" style="background:#fff;padding:10px;border-radius:10px;display:inline-block"></div>
    </div>

    <!-- Primary actions -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <button onclick="wltShareDownloadQR()" style="display:flex;align-items:center;justify-content:center;gap:6px;background:var(--y);color:#1a1a1a;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;cursor:pointer">
        ⬇️ บันทึก QR
      </button>
      <button onclick="wltShareCopyAddr()" style="display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg3);color:var(--t1);border:1px solid var(--border);border-radius:14px;padding:13px;font-size:13px;font-weight:600;cursor:pointer">
        📋 Copy Address
      </button>
    </div>

    <!-- Divider -->
    <div style="font-size:11px;color:var(--t3);text-align:center;margin-bottom:12px;letter-spacing:.5px">แชร์ผ่าน</div>

    <!-- Social grid -->
    <div id="wlt-share-social-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px">
      <!-- populated by JS -->
    </div>
  </div>
</div>
<!-- /wlt-share-sheet -->
